<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity WebGL Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        #unity-hud {
            position: absolute; top: 20px; left: 20px; 
            color: #0f0; font-family: monospace; font-size: 14px;
            pointer-events: none; text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>
    <div id="unity-hud">
        UNITY WEBGL 2.0 (WASM)<br/>
        FPS: <span id="fps">60</span><br/>
        RESOLUTION: 3840x2160 (Downscaled)<br/>
        NETWORK: SYNCED
    </div>
    <div id="canvas-container"></div>
    <script>
        // Simulate Unity Load Time
        setTimeout(() => {
            window.parent.postMessage('unity-ready', '*');
        }, 1500);

        // Three.js Abstract "Game" Engine
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create an intricate 3D Cyber-City / Matrix environment
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        
        const cubes = [];
        for (let i = 0; i < 500; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 50 - 20,
                (Math.random() - 0.5) * 200
            );
            mesh.scale.set(
                Math.random() * 5 + 1,
                Math.random() * 30 + 10,
                Math.random() * 5 + 1
            );
            scene.add(mesh);
            cubes.push(mesh);
        }

        // Add a giant central core
        const coreGeo = new THREE.IcosahedronGeometry(20, 2);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        camera.position.z = 50;
        camera.position.y = 10;

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            core.rotation.x += 0.005;
            core.rotation.y += 0.01;
            
            // Subtle camera bobbing
            camera.position.y = 10 + Math.sin(time) * 5;
            camera.position.x = Math.cos(time * 0.5) * 10;
            camera.lookAt(core.position);

            cubes.forEach((c, i) => {
                c.position.z += 0.5; // move forward simulating speed
                if (c.position.z > 50) {
                    c.position.z = -150;
                }
            });

            // Randomize HUD FPS slightly
            if(Math.random() > 0.9) document.getElementById('fps').innerText = Math.floor(58 + Math.random() * 3);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
